<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEAT">
<meta name="theme-color" content="#0a0004">
<title>HEAT — jeu de couple</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --red:    #FF1020;
    --red2:   #CC0818;
    --rose:   #C08A7A;
    --dark:   #0a0004;
    --card:   rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.07);
    --text:   #ffffff;
    --muted:  rgba(255,255,255,0.35);
    --faint:  rgba(255,255,255,0.12);
  }

  html, body {
    height: 100%; width: 100%;
    background: var(--dark);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ── AMBIENT BACKGROUND ── */
  #ambient {
    position: fixed; inset: 0; z-index: 0;
    transition: background 1.2s ease;
    pointer-events: none;
  }
  #ambient::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.65) 100%);
  }

  /* Grain */
  #grain {
    position: fixed; inset: 0; z-index: 1;
    opacity: 0.055; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    background-size: 128px;
    mix-blend-mode: overlay;
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    transition: opacity 0.4s ease, transform 0.4s ease;
    overflow: hidden;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }

  /* ── SAFE AREAS ── */
  .safe-top    { padding-top: max(48px, env(safe-area-inset-top, 48px)); }
  .safe-bottom { padding-bottom: max(28px, env(safe-area-inset-bottom, 28px)); }

  /* ── TYPOGRAPHY ── */
  .serif    { font-family: 'DM Serif Display', serif; }
  .mono     { font-family: 'Space Mono', monospace; }
  .label    { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; color: var(--muted); font-family: 'Space Mono', monospace; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; font-family: inherit;
    transition: transform 0.15s ease, opacity 0.15s ease;
    -webkit-appearance: none; appearance: none;
  }
  .btn:active { transform: scale(0.94); }

  .btn-primary {
    background: linear-gradient(135deg, #FF4030, #CC0818);
    color: #fff; border-radius: 999px;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    padding: 0 36px; height: 60px; width: 100%;
    box-shadow: 0 8px 32px rgba(255,16,32,0.4);
    position: relative; overflow: hidden;
  }
  .btn-primary::before {
    content: ''; position: absolute;
    inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
    pointer-events: none;
  }

  .btn-ghost {
    background: rgba(255,255,255,0.06);
    color: var(--muted); border-radius: 999px;
    font-size: 13px; font-weight: 600;
    padding: 0 24px; height: 44px;
    border: 1px solid var(--border);
  }

  .btn-accent {
    border-radius: 999px;
    font-size: 13px; font-weight: 700;
    padding: 0 28px; height: 46px;
    color: #000;
  }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px; padding: 16px;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    display: flex; flex-direction: column;
  }

  .tab-bar {
    display: flex; gap: 4px;
    padding: 0 24px;
    margin-bottom: 0;
  }
  .tab-pill {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--muted); background: transparent;
    border: none; transition: all 0.25s ease;
    font-family: 'Space Grotesk', sans-serif;
  }
  .tab-pill.active { color: white; background: rgba(255,255,255,0.10); }

  .tab-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .tab-pane { display: none; flex: 1; flex-direction: column; animation: fadeSlide 0.3s ease; }
  .tab-pane.active { display: flex; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: none; }
  }

  /* HOME TAB */
  #home-tab {
    align-items: center; justify-content: space-between;
    padding: 24px 36px;
  }

  .logo-ring {
    width: 88px; height: 88px; border-radius: 50%;
    border: 1px solid rgba(255,16,32,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: ringPulse 2.4s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100% { box-shadow: 0 0 8px rgba(255,16,32,0.15); border-color: rgba(255,16,32,0.2); }
    50%      { box-shadow: 0 0 28px rgba(255,16,32,0.35); border-color: rgba(255,16,32,0.5); }
  }
  .logo-ring svg { width: 38px; height: 38px; }

  .title-block { text-align: center; }
  .title-heat {
    font-size: 72px; font-weight: 900; letter-spacing: 16px;
    background: linear-gradient(135deg, #fff 30%, #FF6050);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-family: 'Space Grotesk', sans-serif;
    line-height: 1;
  }
  .title-sub { font-size: 12px; color: rgba(255,255,255,0.28); letter-spacing: 5px; margin-top: 6px; font-style: italic; font-family: 'DM Serif Display', serif; }

  /* Temp scale preview */
  .scale-preview { width: 100%; }
  .scale-track { position: relative; height: 3px; background: rgba(255,255,255,0.06); border-radius: 99px; }
  .scale-fill {
    position: absolute; left: 0; top: 0; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #C08A7A, #D05040, #E02040, #FF1020);
    transition: width 0.3s ease;
    width: 42%;
  }
  .scale-dot {
    position: absolute; top: -2px; width: 7px; height: 7px;
    background: #FF1020; border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,16,32,0.8);
    transform: translateX(-50%);
    transition: left 0.3s ease;
    left: 42%;
  }
  .scale-labels { display: flex; justify-content: space-between; margin-top: 8px; }
  .scale-labels span { font-size: 10px; color: rgba(255,255,255,0.2); font-family: 'Space Mono', monospace; }

  .player-hint { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.18); font-size: 12px; justify-content: center; font-family: 'Space Mono', monospace; }

  /* SETTINGS TAB */
  #settings-tab {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 20px 22px 40px;
  }

  .section-header { margin-bottom: 12px; }
  .section-header h2 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
  .section-header p { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
  .preset-btn {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 6px; text-align: center;
    cursor: pointer; font-family: 'Space Grotesk', sans-serif;
    transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .preset-btn:active { transform: scale(0.95); }
  .preset-btn svg { width: 18px; height: 18px; color: rgba(255,255,255,0.55); }
  .preset-btn span { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.4); line-height: 1.3; }

  .cat-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px; }
  .cat-count { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.25); font-family: 'Space Mono', monospace; }

  .event-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 14px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);
    margin-bottom: 6px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .event-row.enabled { background: rgba(255,255,255,0.05); }
  .event-row:active { transform: scale(0.98); }

  .event-icon {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .event-icon svg { width: 16px; height: 16px; }

  .event-info { flex: 1; min-width: 0; }
  .event-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; color: rgba(255,255,255,0.3); }
  .event-row.enabled .event-title { color: white; }
  .event-desc { font-size: 10px; color: rgba(255,255,255,0.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-row.enabled .event-desc { color: rgba(255,255,255,0.38); }

  .spice-dots { display: flex; gap: 3px; flex-shrink: 0; }
  .spice-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.1); }

  .toggle-track {
    width: 34px; height: 19px; border-radius: 99px;
    background: rgba(255,255,255,0.07); position: relative; flex-shrink: 0;
    transition: background 0.25s ease;
  }
  .toggle-thumb {
    position: absolute; top: 2.5px; left: 2.5px;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.25s ease;
  }
  .event-row.enabled .toggle-thumb { transform: translateX(15px); }

  /* ── GAME SCREEN ── */
  #game-screen {
    display: flex; flex-direction: column;
  }

  /* TOP BAR */
  .top-bar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 0 20px; padding-top: max(52px, env(safe-area-inset-top, 52px));
    padding-bottom: 12px;
  }

  .temp-display { display: flex; flex-direction: column; gap: 8px; }
  .temp-number {
    font-size: 52px; font-weight: 900; letter-spacing: -1px;
    font-family: 'Space Grotesk', sans-serif; line-height: 1;
    transition: color 0.4s ease;
  }
  .temp-unit { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.45); vertical-align: super; margin-left: 2px; }

  .seg-bar { display: flex; gap: 5px; align-items: center; }
  .seg {
    width: 22px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.08); overflow: hidden; position: relative;
  }
  .seg-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    border-radius: 2px; transition: width 0.35s ease;
  }

  .badges { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .badge {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 99px;
    font-size: 10px; font-weight: 900; font-family: 'Space Mono', monospace;
    border: 1px solid; animation: badgeIn 0.3s ease;
  }
  @keyframes badgeIn { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform:none; } }
  .badge svg { width: 10px; height: 10px; }

  .close-btn {
    background: rgba(255,255,255,0.07); border: none;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin-top: 4px;
    color: rgba(255,255,255,0.4); transition: opacity 0.2s;
  }
  .close-btn:active { opacity: 0.5; }
  .close-btn svg { width: 14px; height: 14px; }

  /* REWARD ZONE */
  .reward-zone { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 20px; }

  .reward-card { display: flex; flex-direction: column; align-items: center; gap: 20px; animation: rewardIn 0.5s cubic-bezier(.34,1.4,.64,1); }
  @keyframes rewardIn { from { opacity:0; transform: scale(0.85) translateY(20px); } to { opacity:1; transform: none; } }

  .reward-visual {
    width: 200px; height: 200px; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .reward-visual svg { width: 64px; height: 64px; }
  .reward-intensity { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 4px; }
  .intensity-dot { width: 6px; height: 6px; border-radius: 50%; }

  .reward-text { text-align: center; }
  .reward-label { font-size: 23px; font-weight: 600; font-family: 'DM Serif Display', serif; font-style: italic; margin-bottom: 6px; line-height: 1.2; }
  .reward-desc { font-size: 13px; color: rgba(255,255,255,0.42); line-height: 1.5; }

  .timer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 99px; margin-top: 10px;
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
    border: 1px solid;
  }
  .timer-badge svg { width: 12px; height: 12px; }
  .timer-done-btn {
    width: 20px; height: 20px; border-radius: 50%; border: none;
    font-size: 10px; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); color: white;
    transition: transform 0.15s;
  }
  .timer-done-btn:active { transform: scale(0.9); }

  .idle-prompt { text-align: center; color: rgba(255,255,255,0.18); padding: 20px; }
  .idle-prompt svg { width: 44px; height: 44px; margin-bottom: 14px; opacity: 0.5; animation: idlePulse 2.2s ease-in-out infinite; }
  @keyframes idlePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .idle-prompt p { font-size: 13px; font-style: italic; font-family: 'DM Serif Display', serif; line-height: 1.7; }

  /* TEASER / DEBT */
  .bottom-info { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }

  .debt-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 12px;
    background: rgba(192,96,160,0.1); border: 1px solid rgba(192,96,160,0.25);
    animation: slideUp 0.3s ease;
  }
  .debt-banner svg { width: 14px; height: 14px; color: #C060A0; flex-shrink: 0; }
  .debt-text-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8); font-family: 'Space Mono', monospace; }
  .debt-text-sub { font-size: 11px; color: rgba(255,255,255,0.4); }

  .next-teaser {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }

  .mini-arc { width: 28px; height: 28px; flex-shrink: 0; }
  .next-info { flex: 1; }
  .next-pre { font-size: 10px; color: rgba(255,255,255,0.28); font-family: 'Space Mono', monospace; letter-spacing: 1.5px; text-transform: uppercase; }
  .next-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .next-temp { font-size: 13px; font-weight: 700; font-family: 'Space Mono', monospace; }

  /* PLAYER BUTTONS */
  .player-row {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 0 20px; padding-bottom: max(36px, env(safe-area-inset-bottom, 36px));
    padding-top: 12px;
  }

  .player-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; background: none; border: none; padding: 0;
    -webkit-appearance: none; font-family: inherit;
    transition: opacity 0.25s ease;
    position: relative;
  }
  .player-btn.inactive { opacity: 0.35; }
  .player-btn:active .player-circle { transform: scale(0.91); }

  .player-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: all 0.3s ease; }
  .player-btn.active-player .player-dot { background: var(--red); }

  .player-circle {
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.09);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease, transform 0.12s ease;
  }
  .player-btn.active-player .player-circle { background: rgba(255,16,32,0.16); border-color: rgba(255,16,32,0.5); }
  .player-circle svg { width: 28px; height: 28px; color: rgba(255,255,255,0.22); transition: color 0.3s; }
  .player-btn.active-player .player-circle svg { color: var(--red); }

  .player-name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.28); letter-spacing: 1.5px; text-transform: uppercase; font-family: 'Space Mono', monospace; transition: color 0.3s; }
  .player-btn.active-player .player-name { color: white; }
  .player-score { font-size: 10px; color: rgba(255,255,255,0.22); }

  .delta-pop {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 900; pointer-events: none;
    animation: deltaPop 1.3s ease forwards; white-space: nowrap;
    font-family: 'Space Grotesk', sans-serif;
  }
  @keyframes deltaPop {
    0%   { opacity:1; transform: translateX(-50%) translateY(0); }
    70%  { opacity:1; }
    100% { opacity:0; transform: translateX(-50%) translateY(-60px); }
  }

  .flame-center { display: flex; align-items: center; justify-content: center; width: 50px; flex-shrink: 0; }
  .flame-svg { transition: all 0.6s ease; }

  /* SOLO button */
  .solo-btn {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    position: relative; display: flex; align-items: center; justify-content: center;
    background: rgba(255,16,32,0.18); -webkit-appearance: none;
    transition: transform 0.12s ease;
  }
  .solo-btn::before {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
    border: 1.5px solid rgba(255,16,32,0.35);
    animation: soloGlow 1.8s ease-in-out infinite;
  }
  @keyframes soloGlow { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
  .solo-btn:active { transform: scale(0.91); }
  .solo-btn svg { width: 28px; height: 28px; color: var(--red); }

  /* CRITICAL FLASH */
  #crit-flash {
    position: fixed; inset: 0; z-index: 5;
    background: rgba(255,0,0,0.12); pointer-events: none;
    opacity: 0; transition: opacity 0.08s;
  }
  #crit-flash.show { opacity: 1; }

  /* ── OVERLAY SCREENS ── */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  .overlay-inner {
    width: 100%; max-width: 380px;
    transform: scale(0.88); transition: transform 0.35s cubic-bezier(.34,1.4,.64,1);
  }
  .overlay.show .overlay-inner { transform: scale(1); }

  /* EVENT CARD OVERLAY */
  .event-card-box {
    border-radius: 28px; padding: 30px 24px;
    background: rgb(26,13,26);
    border: 1.5px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    text-align: center;
  }
  .event-who { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 2px; }
  .event-tag { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.28); font-family: 'Space Mono', monospace; }
  .event-icon-wrap {
    width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .event-icon-wrap svg { width: 32px; height: 32px; }
  .event-title-text { font-size: 25px; font-weight: 700; line-height: 1.2; }
  .event-desc-text { font-size: 14px; font-style: italic; font-family: 'DM Serif Display', serif; color: rgba(255,255,255,0.52); line-height: 1.6; }

  /* REWARD TIMER OVERLAY */
  .timer-overlay-box { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
  .timer-circle { position: relative; width: 160px; height: 160px; }
  .timer-circle svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer-circle-nums { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer-digits { font-size: 46px; font-weight: 900; font-family: 'Space Grotesk', sans-serif; line-height: 1; }

// ═══════════════════════════════════════════════════════════════
// STATE

let gs = {
  players: [ {name:'Morgane',score:0,taps:0}, {name:'Fabien',score:0,taps:0} ],
  isTwoPlayer: true,
  temperature: 0,
  phase: 'setup',           // setup | playing | eventCard | rewardTimer | exploded | victory
  activePlayer: 0,
  currentReward: null,
  pendingDebt: [],
  nextBoostDouble: false,
  nextBoostCritical: false,
  freezeCooling: false,
  timerRemaining: 0,
  isTimerActive: false,
  tapsSinceEvent: 0,
  nextEventIn: rng(3,5),
  enabledEvents: new Set(EVENT_KINDS.filter(e=>e.spiceLevel<=2).map(e=>e.id)),
  // timers
  _cooldownId: null,

  _currentCard: null,

  // demo tilt for scale preview

  _tiltDir: 1,
  _tiltId: null,
};

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════

function rng(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function rngf(a,b) { return Math.random()*(b-a)+a; }

function currentReward(temp) {
  let r=null;
  for(const rew of REWARDS) { if(temp>=rew.threshold) r=rew; }
  return r;
}
function nextReward(temp) {
  return REWARDS.find(r=>r.threshold>temp)||null;
}
function progressToNext(temp) {
  const cur=currentReward(temp), nxt=nextReward(temp);
  if(!cur||!nxt) return temp>=990?1:0;
  return Math.min((temp-cur.threshold)/(nxt.threshold-cur.threshold),1);
}
function accentForReward(r) { return r ? ACCENT_BY_INTENSITY[r.intensity]||'#FF1020' : '#FF1020'; }

function computeBoost(temp) {
  let delta;
  if(temp<100)      delta=rngf(10,50);
  else if(temp<300) delta=rngf(25,75);
  else if(temp<700) delta=rngf(50,100);
  else              delta=rngf(75,125);
  const newTemp = Math.min(temp+delta, 1050);
  return { delta, newTemp, isExploded: newTemp>1000 };
}

function ambientColor(temp) {
  const t = Math.min(temp,1000)/1000;
  const r = Math.round((0.04+t*0.18)*255);
  const g = 0;
  const b = Math.round((0.04-t*0.03)*255);
  return `rgb(${r},${g},${b})`;
}

function vibrate(pattern) {
  if(navigator.vibrate) navigator.vibrate(pattern);
}

function timeStr(s) {
  const m=Math.floor(s/60), sec=s%60;
  return m>0 ? `${m}:${String(sec).padStart(2,'0')}` : `${s}`;
}

// ═══════════════════════════════════════════════════════════════
// TAB SWITCHING (SETUP)
// ═══════════════════════════════════════════════════════════════

function switchTab(idx) {
  ['home-tab','settings-tab'].forEach((id,i)=>{
    document.getElementById(id).classList.toggle('active', i===idx);
  });
  document.getElementById('tab0').classList.toggle('active', idx===0);
  document.getElementById('tab1').classList.toggle('active', idx===1);
}

// ═══════════════════════════════════════════════════════════════
// SETTINGS RENDER
// ═══════════════════════════════════════════════════════════════

function renderSettings() {
  const categories = ['Mécaniques','Défis & Challenges'];
  let html = '';
  for(const cat of categories) {
    const kinds = EVENT_KINDS.filter(e=>e.category===cat);
    const enabled = kinds.filter(e=>gs.enabledEvents.has(e.id)).length;
    html += `<div class="cat-header">
      <div class="label">${cat}</div>
      <div class="cat-count">${enabled}/${kinds.length}</div>
    </div>`;
    for(const k of kinds) {
      const on = gs.enabledEvents.has(k.id);
      const dots = Array(k.spiceLevel).fill(`<div class="spice-dot" style="background:${on?k.color+'aa':'rgba(255,255,255,0.1)'}"></div>`).join('');
      const color = on ? k.color : 'rgba(255,255,255,0.2)';
      html += `<div class="event-row ${on?'enabled':''}" onclick="toggleEvent('${k.id}')" data-id="${k.id}" style="border-color:${on?k.color+'33':'rgba(255,255,255,0.04)'}">
        <div class="event-icon" style="background:${on?k.color+'26':'rgba(255,255,255,0.04)'}">
          <span style="font-size:16px">${k.icon}</span>
        </div>
        <div class="event-info">
          <div class="event-title">${k.title}</div>
          <div class="event-desc">${k.description}</div>
        </div>
        <div class="spice-dots">${dots}</div>
        <div class="toggle-track" style="background:${on?k.color+'44':'rgba(255,255,255,0.07)'}">
          <div class="toggle-thumb" style="background:${on?k.color:'rgba(255,255,255,0.25)'};transform:translateX(${on?15:0}px)"></div>
        </div>
      </div>`;
    }
  }
  document.getElementById('event-list').innerHTML = html;
}

function toggleEvent(id) {
  if(gs.enabledEvents.has(id)) gs.enabledEvents.delete(id);
  else gs.enabledEvents.add(id);
  renderSettings();
}

function applyPreset(p) {
  if(p==='mechanics')   gs.enabledEvents = new Set(EVENT_KINDS.filter(e=>e.category==='Mécaniques').map(e=>e.id));
  else if(p==='all')    gs.enabledEvents = new Set(EVENT_KINDS.map(e=>e.id));
  else if(p==='challenges') gs.enabledEvents = new Set(EVENT_KINDS.filter(e=>e.category==='Défis & Challenges').map(e=>e.id));
  renderSettings();
}

// ═══════════════════════════════════════════════════════════════
// SCALE PREVIEW ANIMATION
// ═══════════════════════════════════════════════════════════════

function animateScale() {
  gs._tilt += gs._tiltDir * 0.004;
  if(gs._tilt>=0.72) gs._tiltDir=-1;
  if(gs._tilt<=0.12) gs._tiltDir=1;
  const pct = (gs._tilt*100).toFixed(1)+'%';
  document.getElementById('scale-fill').style.width=pct;
  document.getElementById('scale-dot').style.left=pct;
  gs._tiltId = requestAnimationFrame(animateScale);
}

// ═══════════════════════════════════════════════════════════════
// BUILD SEGMENT BAR
// ═══════════════════════════════════════════════════════════════

function buildSegBar() {
  const bar = document.getElementById('seg-bar');
  bar.innerHTML = '';
  for(let i=0;i<10;i++){
    const seg=document.createElement('div'); seg.className='seg'; seg.id=`seg-${i}`;
    const fill=document.createElement('div'); fill.className='seg-fill';
    fill.style.background=SEG_COLORS[i]; fill.style.width='0%';
    seg.appendChild(fill); bar.appendChild(seg);
  }
}

function updateSegBar(temp) {
  for(let i=0;i<10;i++){
    const threshold=(i+1)*100;
    const filled=temp>=threshold;
    const partial=temp>i*100&&!filled;
    const pf=partial?((temp-i*100)/100*100).toFixed(1)+'%':'0%';
    const fill=document.querySelector(`#seg-${i} .seg-fill`);
    if(fill) fill.style.width=filled?'100%':pf;
  }
}

// ═══════════════════════════════════════════════════════════════

function updateAmbient(temp) {
  const c = ambientColor(temp);
  document.getElementById('ambient').style.background = `linear-gradient(135deg, ${c}b0, ${c})`;
}

// ═══════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════

function startGame() {
  // Stop scale preview
  if(gs._tiltId) { cancelAnimationFrame(gs._tiltId); gs._tiltId=null; }

  gs.temperature=0; gs.activePlayer=0; gs.currentReward=null; gs.pendingDebt=[];
  gs.nextBoostDouble=false; gs.nextBoostCritical=false; gs.freezeCooling=false;
  gs.isTimerActive=false; gs.tapsSinceEvent=0; gs.nextEventIn=rng(1,3);
  gs.phase='playing';

  // Reset player scores
  gs.players[0].score=0; gs.players[0].taps=0;
  gs.players[1].score=0; gs.players[1].taps=0;

  showScreen('game-screen');
  buildSegBar();
  renderGame();
  startCooldown();
}

function resetToSetup() {
  stopCooldown(); stopTimer();
  gs.temperature=0; gs.phase='setup'; gs.currentReward=null; gs.pendingDebt=[];
  gs.isTimerActive=false;
  hideAllOverlays();
  showScreen('setup-screen');
  updateAmbient(0);
  gs._tiltId = requestAnimationFrame(animateScale);
}

function tap(playerIdx) {
  if(gs.phase!=='playing') return;
  if(gs.isTwoPlayer && playerIdx!==gs.activePlayer) return;

  gs._lastTap = Date.now();
  gs.tapsSinceEvent++;
  gs.players[playerIdx].taps++;

  let result = computeBoost(gs.temperature);
  let delta = result.delta;

  if(gs.nextBoostDouble) {
    delta = delta*2;
    result = { delta, newTemp:Math.min(gs.temperature+delta,1050), isExploded:(gs.temperature+delta)>1000 };
    showCritFlash();
    vibrate([20,10,30,10,40]);
  } else if(gs.nextBoostCritical) {
    showCritFlash();
    vibrate([20,10,30,10,40]);
  } else {
    const intensity = Math.round((Math.min(gs.temperature/1000,1)*0.8+0.2)*30);
    vibrate(intensity);
  }

  gs.nextBoostDouble=false; gs.nextBoostCritical=false;

  const prevReward = gs.currentReward;
  gs.temperature = result.newTemp;
  const newReward = currentReward(gs.temperature);

  if(newReward && newReward.threshold !== prevReward?.threshold) {
    gs.currentReward=newReward;
    gs.players[playerIdx].score++;
    if(newReward.timerDuration) {
      startTimer(newReward.timerDuration);
    }
  }

  showDelta(playerIdx, delta);

  if(result.isExploded) {
    gs.phase='exploded';
    stopCooldown();
    renderGame();
    showExplosion(playerIdx);
    return;
  }

  if(gs.tapsSinceEvent>=gs.nextEventIn) {
    gs.tapsSinceEvent=0;
    gs.nextEventIn=rng(3,5);
    showEventCard();
    return;
  }

  if(gs.isTwoPlayer) gs.activePlayer=1-gs.activePlayer;
  renderGame();
}

function computeBoostActual(temp) {
  let delta;
  if(temp<100) delta=rngf(10,50);
  else if(temp<300) delta=rngf(25,75);
  else if(temp<700) delta=rngf(50,100);
  else delta=rngf(75,125);
  return { delta, newTemp:Math.min(temp+delta,1050), isExploded:(temp+delta)>1000 };
}

// ═══════════════════════════════════════════════════════════════
// COOLDOWN LOOP
// ═══════════════════════════════════════════════════════════════

function startCooldown() {
  stopCooldown();
  gs._cooldownId = setInterval(()=>{
    if(gs.phase!=='playing') return;
    const idle=(Date.now()-gs._lastTap)/1000;
    if(idle>5 && !gs.freezeCooling && gs.temperature>0) {
      gs.temperature=Math.max(0,gs.temperature-1.0);
      const r=currentReward(gs.temperature);
      if(r?.threshold!==gs.currentReward?.threshold) gs.currentReward=r;
      renderGame();
    }
  }, 1000);
}
function stopCooldown() { clearInterval(gs._cooldownId); gs._cooldownId=null; }

// ═══════════════════════════════════════════════════════════════
// REWARD TIMER
// ═══════════════════════════════════════════════════════════════

function startTimer(seconds) {
  stopTimer();
  gs.timerRemaining=seconds; gs.isTimerActive=true; gs._timerTotal=seconds;
  gs.phase='rewardTimer';
  showTimerOverlay();
  gs._countdownId = setInterval(()=>{
    gs.timerRemaining--;
    if(gs.timerRemaining<=0) {
      stopTimer();
      gs.isTimerActive=false;
      gs.phase='playing';
      if(gs.isTwoPlayer) gs.activePlayer=1-gs.activePlayer;
      hideOverlay('timer-overlay');
      renderGame();
      return;
    }
    updateTimerOverlay();
    updateInlineTimer();
  },1000);
}
function stopTimer() { clearInterval(gs._countdownId); gs._countdownId=null; }
function dismissTimer() {
  stopTimer(); gs.isTimerActive=false; gs.phase='playing';
  if(gs.isTwoPlayer) gs.activePlayer=1-gs.activePlayer;
  hideOverlay('timer-overlay');
  renderGame();
}

// ═══════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════

function randomEvent() {
  let pool = EVENT_KINDS.filter(e=>gs.enabledEvents.has(e.id));
  if(gs.temperature<300) pool=pool.filter(e=>e.spiceLevel<=2);
  if(gs.temperature<150) pool=pool.filter(e=>e.spiceLevel<=1);
  if(!pool.length) pool=EVENT_KINDS.filter(e=>['doubleBet','freeze','reversal'].includes(e.id));
  return pool[Math.floor(Math.random()*pool.length)];
}

function showEventCard() {
  gs.phase='eventCard';
  gs._currentCard = randomEvent();
  renderEventCard();
  showOverlay('event-overlay');
}

function applyEvent(id) {
  hideOverlay('event-overlay');
  const kind = EVENT_KINDS.find(e=>e.id===id);
  switch(id) {
    case 'doubleBet':     gs.nextBoostDouble=true; break;
    case 'freeze':
      gs.freezeCooling=true;
      setTimeout(()=>{ gs.freezeCooling=false; renderGame(); },20000);
      break;
    case 'forceCool':
      gs.temperature=Math.max(0,gs.temperature-150);
      gs.currentReward=currentReward(gs.temperature);
      break;
    case 'debtStack':
      gs.pendingDebt=REWARDS.filter(r=>gs.temperature>=r.threshold);
      break;
    case 'joker':
      gs.temperature=Math.min(gs.temperature+120,1050);
      if(gs.temperature>1000){ gs.phase='exploded'; stopCooldown(); showExplosion(gs.activePlayer); renderGame(); return; }
      break;
    case 'reversal':
      if(gs.isTwoPlayer) gs.activePlayer=1-gs.activePlayer;
      break;
    default: break; // challenge cards — display only
  }
  gs.phase='playing';
  if(gs.isTwoPlayer) gs.activePlayer=1-gs.activePlayer;
  renderGame();
}

  const num=document.getElementById('temp-num');

  if(temp>0){ num.textContent=Math.min(Math.round(temp),1000); unit.style.display=''; }
  else { num.textContent='—'; unit.style.display='none'; }

  // Badges
  renderBadges();

  // Reward zone
  renderRewardZone();

  // Bottom info
  renderBottomInfo();

  renderPlayerRow();
}

}

}

function showDelta(playerIdx, delta) {
  const btnId = gs.isTwoPlayer ? `pbtn${playerIdx}` : 'player-row';
  const parent = document.getElementById(btnId)||document.getElementById('player-row');
  if(!parent) return;
  const el=document.createElement('div');
  el.className='delta-pop';
  el.textContent=`+${Math.round(delta)}°`;
  el.style.color=delta>150?'#FF1020':accentForReward(gs.currentReward);
  el.style.fontSize=delta>150?'22px':'16px';
  parent.style.position='relative';
  parent.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}
